name: "Terraform CLI with Terraform Cloud Backend"

on:
  workflow_dispatch:      # manual trigger button in GitHub
  push:
    branches:
      - main              # also run on push to main (optional)

jobs:
  terraform:
    runs-on: ubuntu-latest

    env:
      TF_TOKEN_app_terraform_io: ${{ secrets.TF_API_TOKEN }}
      # Optional but nice: avoids interactive prompts
      TF_IN_AUTOMATION: "true"

    defaults:
      run:
        working-directory: .  # root of repo – adjust if TF files in subdir

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.5   # or any version you like

      - name: Terraform Init
        run: |
          terraform init

      - name: Terraform Plan
        run: |
          terraform plan \
            -var-file="test.tfvars"

#      - name: Terraform Apply
#        run: |
#          terraform apply \
#            -var-file="test.tfvars" \
#            -auto-approve